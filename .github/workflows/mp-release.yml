name: Meltingplot release

# Builds the Duet 3 main board firmware from this repository and, for a tag named like the
# firmware version (e.g. 3.7.0-rc.1+2-mp.1), publishes a GitHub pre-release with the binaries
# attached. A manual run only builds and stores the binaries as workflow artifacts.

on:
  push:
    tags:
      - "*-mp.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ARM_TOOLCHAIN: arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi
      UPSTREAM_BRANCH: 3.7-dev
      # Libraries come from the Meltingplot forks so that fixes can be applied there before upstream
      # accepts them. The release notes list the commits that were built.
    steps:
      - name: "Check out RepRapFirmware"
        uses: actions/checkout@v6
        with:
          path: "./RepRapFirmware"
          fetch-depth: 0

      - name: "Check out CANlib"
        uses: actions/checkout@v6
        with:
          repository: "Meltingplot/CANlib"
          ref: "3.7-dev"
          path: "./CANlib"

      - name: "Check out CoreN2G"
        uses: actions/checkout@v6
        with:
          repository: "Meltingplot/CoreN2G"
          ref: "3.7-dev"
          path: "./CoreN2G"

      - name: "Check out FreeRTOS"
        uses: actions/checkout@v6
        with:
          repository: "Meltingplot/FreeRTOS"
          ref: "3.7-dev"
          path: "./FreeRTOS"

      - name: "Check out LibTinyusb"
        uses: actions/checkout@v6
        with:
          repository: "Meltingplot/LibTinyusb"
          ref: "3.7-dev"
          path: "./LibTinyusb"
          submodules: "recursive"

      - name: "Check out LibMbedTls"
        uses: actions/checkout@v6
        with:
          repository: "Meltingplot/LibMbedTls"
          ref: "master"
          path: "./LibMbedTls"

      - name: "Check out RRFLibraries"
        uses: actions/checkout@v6
        with:
          repository: "Meltingplot/RRFLibraries"
          ref: "3.7-dev"
          path: "./RRFLibraries"

      - name: "Check out WiFiSocketServerRTOS"
        uses: actions/checkout@v6
        with:
          repository: "Meltingplot/WiFiSocketServerRTOS"
          ref: "tls_support"
          path: "./WiFiSocketServerRTOS"

      - name: "Read version"
        id: version
        working-directory: ./RepRapFirmware
        run: |
          VERSION=$(sed -n 's/^# define MAIN_VERSION\s\+"\(.\+\)"$/\1/p' src/Version.h)
          echo "Version.h: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match MAIN_VERSION $VERSION" >&2
            exit 1
          fi

      - name: "Prepare CrcAppender"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R Duet3D/CrcAppender --pattern "CrcAppender-linux-x64"
          chmod +x ./CrcAppender-linux-x64
          sudo mv ./CrcAppender-linux-x64 /usr/bin/CrcAppender

      - name: "Set up ARM GCC"
        run: |
          curl -L -o "./$ARM_TOOLCHAIN.tar.xz" "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/$ARM_TOOLCHAIN.tar.xz"
          tar -xf "./$ARM_TOOLCHAIN.tar.xz"

      - name: "Build firmware"
        working-directory: ./RepRapFirmware
        env:
          CROSS_COMPILE: ${{ github.workspace }}/${{ env.ARM_TOOLCHAIN }}/bin/arm-none-eabi-
        run: |
          make -j"$(nproc)" all

      - name: "Arrange files"
        run: |
          mkdir -p upload/maps
          cp ./RepRapFirmware/*/Duet3Firmware_*.bin ./RepRapFirmware/*/Duet3Firmware_*.uf2 ./upload/
          cp ./RepRapFirmware/*/Duet3Firmware_*.map ./upload/maps/
          (cd ./upload && sha256sum *.bin *.uf2 > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: "Write release notes"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CROSS_COMPILE: ${{ github.workspace }}/${{ env.ARM_TOOLCHAIN }}/bin/arm-none-eabi-
        run: |
          cd ./RepRapFirmware
          git fetch -q https://github.com/Duet3D/RepRapFirmware.git "$UPSTREAM_BRANCH"
          UPSTREAM=$(git rev-parse --short FETCH_HEAD)
          BASE=$(git merge-base HEAD FETCH_HEAD)
          UPSTREAM_VERSION=$(git show "$BASE:src/Version.h" | sed -n 's/^# define MAIN_VERSION\s\+"\(.\+\)"$/\1/p')
          cd ..
          {
            echo "Duet 3 main board firmware \`$VERSION\` — Meltingplot build of upstream RepRapFirmware \`$UPSTREAM_BRANCH\` ($(git -C ./RepRapFirmware rev-parse --short "$BASE"), version $UPSTREAM_VERSION). The \`-mp.N\` suffix makes the version differ from the upstream string so that DuetSoftwareFramework flashes it on an image update."
            echo
            echo "**Changes over upstream $UPSTREAM_VERSION**"
            echo
            git -C ./RepRapFirmware log --format='- %s' --no-merges "$BASE..HEAD" | grep -v '^- Version: ' || true
            echo
            echo "**Build**"
            echo
            echo "- Branch: \`$UPSTREAM_BRANCH\`, tag \`$VERSION\` at $(git -C ./RepRapFirmware rev-parse --short HEAD); upstream \`$UPSTREAM_BRANCH\` tip at build time $UPSTREAM"
            echo "- Toolchain: Arm GNU Toolchain 15.2.Rel1, top-level Makefile (\`make all\`), CRC appended"
            libs=""
            for lib in CANlib CoreN2G FreeRTOS LibTinyusb LibMbedTls RRFLibraries WiFiSocketServerRTOS; do
              libs="$libs, $lib $(git -C ./$lib rev-parse --short HEAD)"
            done
            echo "- Libraries (Meltingplot forks): ${libs#, }"
            for bin in ./upload/Duet3Firmware_*.bin; do
              name=$(basename "$bin" .bin)
              elf=$(ls ./RepRapFirmware/*/"$name".elf | head -n 1)
              text=$("${CROSS_COMPILE}size" "$elf" | awk 'NR==2 {print $1}')
              crc=$(python3 -c "import sys; d=open(sys.argv[1], 'rb').read(); print('0x%08X' % int.from_bytes(d[-4:], 'little'))" "$bin")
              echo "- ${name#Duet3Firmware_}: appended CRC32 $crc, $(stat -c %s "$bin") bytes (text $text)"
            done
            echo "- Reports as \`$VERSION\` in M122"
            echo "- Not yet tested on hardware"
          } > notes.md
          cat notes.md

      - name: "Attach binaries"
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            ./upload/*.bin
            ./upload/*.uf2
            ./upload/SHA256SUMS.txt
            ./notes.md
          compression-level: 0

      - name: "Attach symbols"
        uses: actions/upload-artifact@v7
        with:
          name: symbols
          path: ./upload/maps/*.map

      - name: "Create release"
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease --verify-tag \
            --title "Duet 3 MB6HC + MB6XD + Mini5plus $VERSION" \
            --notes-file ./notes.md \
            ./upload/*.bin ./upload/*.uf2 ./upload/SHA256SUMS.txt
